name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID for the build_wheels workflow to pull artifacts from."
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      # Every wheels-* artifact the build workflow produces, by pattern rather
      # than by name. The cp314 jobs are separate (cibuildwheel 2.21.2 does not
      # know the identifier, and cp314 needs manylinux_2_28 on Linux), so
      # listing artifacts individually silently dropped wheels-linux-2_28,
      # wheels-macos-cp314 and wheels-windows-cp314 -- cp314 would have been
      # built by CI and then not published.
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List what will be published
        run: ls -la dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
