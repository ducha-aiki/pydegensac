name: Build

on: [push]

jobs:
  build_wheels_linux:
    name: Build wheels on linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

      - name: Create virtualenv
        run: python3 -m venv .venv

      - name: Install cibuildwheel
        run: .venv/bin/python -m pip install cibuildwheel==2.21.2

      - name: Build wheels
        run: .venv/bin/python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BEFORE_ALL_LINUX: yum install -y lapack-devel blas-devel gcc-gfortran
          CIBW_BUILD: >
            cp38-manylinux_x86_64
            cp39-manylinux_x86_64
            cp310-manylinux_x86_64
            cp311-manylinux_x86_64
            cp312-manylinux_x86_64
            cp313-manylinux_x86_64
            cp314-manylinux_x86_64
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
          CIBW_TEST_COMMAND: >
            python -m pytest {project}/tests -q &&
            python -c "import os, runpy; os.chdir(r'{project}/examples');
            runpy.run_path('simple-example.py', run_name='__main__')"
          CIBW_TEST_REQUIRES: opencv-python-headless<5 pytest
          CIBW_ENVIRONMENT: PYDEGENSAC_GOLDEN_EXACT=0

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*.whl

      - name: Publish wheels to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl

  build_wheels_mac:
    name: Build wheels on macOS
    needs: build_wheels_linux
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

      - name: Create virtualenv
        run: python3 -m venv .venv

      - name: Install cibuildwheel
        run: .venv/bin/python -m pip install cibuildwheel==2.21.2

      - name: Build wheels
        run: .venv/bin/python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BEFORE_ALL_MACOS: brew install openblas lapack
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_BUILD: >
            cp38-macosx_x86_64
            cp39-macosx_x86_64 cp39-macosx_arm64
            cp310-macosx_x86_64 cp310-macosx_arm64
            cp311-macosx_x86_64 cp311-macosx_arm64
            cp312-macosx_x86_64 cp312-macosx_arm64
            cp313-macosx_x86_64 cp313-macosx_arm64
            cp314-macosx_x86_64 cp314-macosx_arm64
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          CIBW_TEST_COMMAND: >
            python -m pytest {project}/tests -q &&
            python -c "import os, runpy; os.chdir(r'{project}/examples');
            runpy.run_path('simple-example.py', run_name='__main__')"
          CIBW_TEST_REQUIRES: opencv-python-headless<5 pytest
          CIBW_TEST_SKIP: "cp38-macosx_*:arm64"
          CIBW_ENVIRONMENT: PYDEGENSAC_GOLDEN_EXACT=0

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: wheelhouse/*.whl

  build_wheels_windows:
    name: Build wheels on windows
    needs: build_wheels_linux
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install cibuildwheel
        run: .venv\Scripts\python -m pip install cibuildwheel==2.21.2

      - name: Build wheels
        run: .venv\Scripts\python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BEFORE_ALL_WINDOWS: vcpkg install openblas lapack --triplet x64-windows
          CIBW_BUILD: >
            cp38-win_amd64
            cp39-win_amd64
            cp310-win_amd64
            cp311-win_amd64
            cp312-win_amd64
            cp313-win_amd64
            cp314-win_amd64
          CIBW_ENVIRONMENT_WINDOWS: >
            VCPKG_ROOT=C:/vcpkg
            CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            PYDEGENSAC_GOLDEN_EXACT=0
          CIBW_TEST_COMMAND: >
            python -m pytest {project}/tests -q &&
            python -c "import os, runpy; os.chdir(r'{project}/examples');
            runpy.run_path('simple-example.py', run_name='__main__')"
          CIBW_TEST_REQUIRES: opencv-python-headless<5 pytest

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl

      - name: Publish wheels to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
